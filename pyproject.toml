[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-test"
version = "0.1.0"
description = "Source-grounded 3-agent resume tailoring pipeline (analyzer / writer / reviewer)."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abdulrahman Abu Ghazaleh" }]
dependencies = [
    "anthropic>=0.40.0",
    "docxtpl>=0.16.7",
    "docx2pdf>=0.1.8",
    "python-docx>=1.1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.scripts]
resume-test = "resume_test.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
